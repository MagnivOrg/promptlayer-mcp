name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gcp/package-lock.json
      - run: npm ci
      - run: npm --prefix gcp ci
      - run: npm test
      - run: npx tsc --project gcp/tsconfig.json --noEmit
